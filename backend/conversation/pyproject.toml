[project]
name = "gtw-conversation"
version = "0.1.0"
description = "GTW voice check-in backend: Swedish conversation, field extraction, red flags"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nvidia-cublas-cu12>=12.9.2.10 ; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9,<10 ; sys_platform == 'linux'",
    "litellm[proxy]>=1.84,<2",
    "openai>=2.20,<3",
    "pipecat-ai[local,piper,runner,webrtc,whisper]>=1.12.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "supabase>=2.31.0",
]

[project.scripts]
gtw-chat = "gtw.cli_chat:main"
gtw-voice = "gtw.voice_bot:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "gtw"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
