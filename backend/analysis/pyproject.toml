[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patient-journal-analysis"
version = "0.1.0"
description = "Data processing and analysis backend for patient journal system"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "GTW Team", email = "team@gtw.example" }
]

[project.dependencies]
fastapi = "^0.109.0"
uvicorn = { extras = ["standard"], version = "^0.27.0" }
pydantic = "^2.5.0"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
